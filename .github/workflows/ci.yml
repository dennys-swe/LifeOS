# Integração contínua: roda a suíte do backend e o lint/testes/build do frontend
# em todo push na main e em todo pull request.
#
# Não usa nenhum secret — a suíte do backend roda contra SQLite em memória e o
# frontend não acessa serviços externos.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # mesma linha que o Render usa em produção
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: vitest
        run: npm test -- --run

      - name: build de produção
        run: npm run build
